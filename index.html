  <script>
    // Tema antes da página aparecer (evita piscar claro no tema escuro)
    (function () {
      var q = new URLSearchParams(location.search).get("tema");
      var c = window.SITE_CONFIG || {};
      var t = (q || c.tema || "claro").toLowerCase() === "escuro" ? "escuro" : "claro";
      var cores = c.cores || {};
      var tc = cores[t] || {};
      var r = document.documentElement;
      r.dataset.tema = t;
      if (tc.fundo) r.style.setProperty("--paper", tc.fundo);
      if (tc.texto) r.style.setProperty("--ink", tc.texto);
      if (cores.destaque) r.style.setProperty("--promo", cores.destaque);
      if (cores.marca) r.style.setProperty("--black", cores.marca);
    })();
  </script>
